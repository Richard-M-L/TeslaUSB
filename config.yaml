# TeslaUSB 配置文件
#
# 编辑此文件以匹配你的安装环境。
# Bash 脚本和 Python Web 应用均使用此文件。
#
# 所有路径、设置和凭据在此统一定义，作为单一数据源。

# ============================================================================
# 安装与路径
# ============================================================================
installation:
  target_user: pi # 运行 TeslaUSB 服务的 Linux 用户（安装过程中由 SUDO_USER 自动覆盖）
  mount_dir: /mnt/gadget # USB 硬盘挂载目录

# ============================================================================
# 磁盘镜像
# ============================================================================
disk_images:
  cam_name: usb_cam.img # 行车记录仪磁盘镜像文件名
  lightshow_name: usb_lightshow.img # 灯光秀磁盘镜像文件名
  cam_label: TeslaCam # 行车记录仪盘文件系统标签
  lightshow_label: Lightshow # 灯光秀盘文件系统标签
  music_name: usb_music.img # 音乐磁盘镜像文件名（可选第三 LUN）
  music_label: Music # 音乐盘文件系统标签（特斯拉要求 FAT32）
  music_enabled: true # 创建并呈现音乐分区（LUN2）
  music_fs: fat32 # 音乐镜像文件系统（推荐 fat32 以兼容特斯拉）
  boot_fsck_enabled: true # 启动时自动修复文件系统（推荐）

# ============================================================================
# 安装配置（仅 setup_usb.sh 使用）
# ============================================================================
# 以下值专用于安装流程，可在此配置或留空 ("") 以在安装过程中交互式输入。
setup:
  part1_size: "" # 行车记录仪盘大小（如 "50G"，留空则交互式输入）
  part2_size: "" # 灯光秀盘大小（如 "10G"，留空则交互式输入）
  part3_size: "" # 音乐盘大小（如 "32G"，留空则跳过/交互式输入）
  reserve_size: "" # 树莓派文件系统保留空间余量（默认：5G）
  archive_reserve_size: "50G" # SD 卡上为 RecentClips 存档预留的空间

# ============================================================================
# 网络与安全
# ============================================================================
network:
  samba_password: tesla # Samba 认证用户密码（请修改！）
  web_port: 80 # Web 界面端口（80 为强制门户所必需——请勿更改）

# ============================================================================
# 离线热点配置
# ============================================================================
# STA WiFi 不可用时用于车内/移动访问的回退 WiFi 热点
offline_ap:
  enabled: true # 设为 false 禁用回退热点
  interface: wlan0 # 用于 AP/STA 的 WiFi 接口
  ssid: TeslaUSB # 热点激活时广播的 SSID（请修改！）
  passphrase: teslausb1234 # WPA2 密码 8-63 字符（请修改！）
  channel: 6 # 2.4GHz 信道 (1-11)
  ipv4_cidr: 192.168.4.1/24 # 热点接口静态 IP
  dhcp_start: 192.168.4.10 # DHCP 范围起始
  dhcp_end: 192.168.4.50 # DHCP 范围结束
  check_interval: 20 # 健康检查间隔（秒）
  disconnect_grace: 30 # 离线多少秒后启动热点
  min_rssi: -70 # 关闭热点所需的最低 RSSI (dBm)
  stable_seconds: 20 # 信号稳定多少秒后停止热点
  ping_target: 8.8.8.8 # 确认广域网可达性的 Ping 目标
  retry_seconds: 300 # 热点激活期间每隔 N 秒重试 STA 连接
  virtual_interface: uap0 # 虚拟热点接口名称（始终启用并发模式）
  force_mode: auto # 持久强制模式：auto, force_on, force_off

# ============================================================================
# 系统配置文件路径
# ============================================================================
system:
  config_file: /boot/firmware/config.txt # 树莓派启动配置
  samba_conf: /etc/samba/smb.conf # Samba 配置文件

# ============================================================================
# Web 应用配置
# ============================================================================
web:
  secret_key: CHANGE-THIS-TO-A-RANDOM-SECRET-KEY-ON-FIRST-INSTALL # Flask 密钥（如为默认值则自动生成）
  max_lock_chime_size: 1048576 # 1 MiB (1024 * 1024 字节)
  max_lock_chime_duration: 10.0 # 10 秒（可根据特斯拉车型调整）
  min_lock_chime_duration: 0.3 # 最短 300ms
  speed_range_min: 0.5 # 半速（音频修剪器）
  speed_range_max: 2.0 # 双倍速（音频修剪器）
  speed_step: 0.05 # 精细调节（音频修剪器）
  lock_chime_filename: LockChime.wav # 当前锁车音效文件名
  chimes_folder: Chimes # part2 上存放自定义锁车音效的文件夹
  lightshow_folder: LightShow # part2 上存放灯光秀的文件夹
  max_upload_size_mb: 2048 # 音乐/灯光秀最大上传大小 (MiB)
  max_upload_chunk_mb: 16 # 流式上传块大小 (MiB)

# ============================================================================
# 地图与地理索引配置
# ============================================================================
mapping:
  enabled: true                          # 启用哨兵视频 GPS/遥测数据索引
  sample_rate: 30                        # 每 N 帧提取一次（30 = 30fps 下约每秒一次）
  trip_gap_minutes: 5                    # 路径点间隔多少分钟开始新行程
  # Phase 5.9 (issue #102) — 在设置 → 高级中开放。
  index_too_new_seconds: 120             # 跳过 mtime 小于此秒数的视频（特斯拉仍在写入）
  event_detection:
    harsh_brake_threshold: -4.0          # m/s² 纵向（负值 = 刹车）
    emergency_brake_threshold: -7.0      # m/s² 纵向
    hard_accel_threshold: 3.5            # m/s² 纵向（正值 = 加速）
    sharp_turn_lateral_g: 4.0            # m/s² 横向
    speed_limit_mps: 35.76              # ~129 km/h 超速警报阈值（0 = 禁用）

# ============================================================================
# 云存档配置
# ============================================================================
# 通过 rclone 自动同步哨兵视频到云存储
cloud_archive:
  enabled: true
  # 云服务商（通过 Web 界面配置——凭据加密存储，不在此处）
  provider: ""                           # google_drive | onedrive | dropbox | s3 | b2 | wasabi
  remote_path: "TeslaUSB"               # 云存储上的路径/文件夹
  # 同步行为
  sync_folders:                          # 要同步的 TeslaCam 子文件夹
    - SentryClips
    - SavedClips
    - RecentClips
  priority_order:                        # 同步优先级（第一个最高，用户可配置）
    - SentryClips
    - SavedClips
    - RecentClips
  max_upload_mbps: 5                     # 带宽限制（树莓派上传能力有限）
  cloud_reserve_gb: 1                    # 云端保留空间（不要填满到 100%）
  keep_local_after_upload: true          # 上传到云端后保留本地文件
  sync_non_event_videos: false          # 主动选择：同步无事件或无地理位置的视频
  cloud_auto_cleanup: false              # 存储空间不足时自动删除旧云端视频
  cloud_cleanup_threshold_pct: 90        # 云端使用量超过此百分比时删除
  cloud_min_retention_days: 30           # 至少保留此天数的视频
  # Phase 2c (issue #76) — SD 卡上 ArchivedClips 的本地存储管理。
  # 保留策略修剪会遍历 ~/ArchivedClips 并删除超过此天数的 *.mp4 文件；
  # geodata.db 中的 trip/waypoint/event 行将保留（仅置空 video_path 指针）。
  # 当 SD 卡空闲空间低于 disk_space_critical_mb 时，磁盘空间守卫将拒绝新副本并记录 CRITICAL。
  archived_clips_retention_days: 30      # ArchivedClips/*.mp4 的本地 SD 卡保留天数
  # Phase 2.6 — 批量云同步重试上限。连续失败达到此次数后，
  # 行状态从 'failed' 变为 'dead_letter'，不再自动重试。
  # 失败的行仍可通过"失败任务"页面（Phase 4）手动重试，
  # 或在 cloud_sync.db 中手动将状态改回 'pending'。
  retry_max_attempts: 5                  # 1-20；默认 5
  # Phase 1 item 1.3 — "保留策略尊重云端状态"。控制保留修剪是否允许
  # 删除尚未备份到云端（cloud_synced_files.db 中 status='synced'）的视频。
  #   null  → 自动：配置了云服务商时保留未上传视频，否则仅按时间删除（推荐默认值）。
  #   false → "保留至备份完成"——保护超过保留期限的未上传视频。
  #           界面中显示为设置 → 云同步中的开关。
  #   true  → 仅按时间删除（会丢失等待上传的视频）。
  delete_unsynced: null
  disk_space_warning_mb: 500             # SD 卡空闲空间低于此值时记录 WARNING
  disk_space_critical_mb: 100            # 空闲空间低于此值时拒绝新存档副本
  disk_space_pause_seconds: 300          # 磁盘空间严重不足后工作线程暂停时长

  # Wave 4 (issue #184)：统一 ``pipeline_queue`` 集成。
  #
  # 云工作线程现在从统一 ``pipeline_queue``（在 PR-A → PR-F3 中添加）读取任务。
  # 以下标志是切换开关。PR-F4 将它们默认设为 ON；
  # 从 pre-PR-F4 版本升级的现有安装将在下次服务重启时自动采用统一管道。
  #
  # ``enqueue_to_pipeline`` — 生产者钩子。为 true 时，``_discover_events``
  # 发现的每个事件还会以 ``stage='cloud_pending'`` 入队至
  # ``pipeline_queue``（通过现有 UNIQUE 索引保证幂等性）。
  # 默认 ``true``（直到 PR-F4 为 ``false``）——需要回退到传统磁盘遍历路径的
  # 运维人员可将此项设为 false。
  enqueue_to_pipeline: true
  # ``shadow_pipeline_queue`` — 切换期间使用的可观测性填充层。
  # 将传统读取器的首选结果与 ``pipeline_queue`` 的前 N 条进行比对，
  # 不一致时记录 WARNING。
  # 默认 ``false``（直到 PR-F4 为 ``true``）——读取器现在本身就是统一队列，
  # 因此比对是同义反复。
  shadow_pipeline_queue: false
  # ``use_pipeline_reader`` — 为 true 时，云工作线程从
  # ``pipeline_queue.claim_next_for_stage(stage='cloud_pending')``
  # 获取下一个上传任务，而非遍历磁盘。PR-F3 添加了读取器；
  # PR-F4 将默认值改为 ``true``。传统读取器路径保留在 ``false`` 后，
  # 仅作为一个版本的滚动回退安全保障；后续版本将完全移除。
  use_pipeline_reader: true

# ============================================================================
# 存储与保留策略配置（Phase 3a.2 — 关闭 issue #98 部分）
# ============================================================================
# 归档/视频保留策略的单一数据源。替代传统的 ``cleanup_config.json``
# （首次启动时自动迁移）以及分散的 ``archive.retention_days`` /
# ``cloud_archive.archived_clips_retention_days`` 值
#（保留作为向后兼容的回退方案）。
#
# 在 Web 界面的设置 → 存储与保留策略中展示，用户无需 SSH 即可管理保留策略。
# 所有更改在下次保留策略执行时生效（无需重启服务）。
cleanup:
  # 0 = 从传统回退链继承
  # (cloud_archive.archived_clips_retention_days → archive.retention_days → 30)。
  # 首次启动时，启动迁移会从传统键值填充此值，使现有自定义设置在行为不变的前提下
  # 平滑过渡。从设置界面保存时也会将具体值写入此处，使其从此成为统一数据源。
  default_retention_days: 0
  free_space_target_pct: 10              # 尽量保持至少此百分比的 SD 卡空闲空间；低于此值则激进修剪
  max_archive_size_gb: 0                 # ArchivedClips 总大小硬上限；0 = 无上限（仅按时间保留）— Phase 5 将上限接入修剪
  short_retention_warning_days: 7        # 默认保留天数低于此值时在界面中显示警告
  policies:                              # 按文件夹覆盖（空 dict = 全部使用默认值）
    # 示例（取消注释以覆盖特定文件夹的默认值）：
    # SentryClips:
    #   enabled: false
    #   retention_days: 90
    # SavedClips:
    #   enabled: false
    #   retention_days: 365
    # RecentClips:
    #   enabled: false
    #   retention_days: 30
    # ArchivedClips:
    #   enabled: true
    #   retention_days: 30

# Wave 4 PR-F4 (issue #184)：独立的 ``live_event_sync``
# 配置块已移除。直播事件上传（Sentry/Saved）现为一等 ``pipeline_queue`` 行，
# 由 file_watcher 的 event.json 钩子以 ``PRIORITY_LIVE_EVENT`` (= 0) 入队，
# 因此统一 cloud_archive 工作线程会自动在任何批量追赶行之前处理它们。
# 不再有单独的启用标志、队列、工作线程、重试策略或每日数据上限——
# ``cloud_archive`` 的重试/上限设置同样适用于直播事件。
#（先前的 ``live_event_sync.upload_scope: "event_minute"``
# 摄像头子集选择已移除；直播事件上传完整事件目录，与批量事件相同。
# "仅分钟级"优化在公开文档中未说明，且几乎没有特斯拉事件超过一分钟。）

# ============================================================================
# RecentClips 存档配置
# ============================================================================
# 在特斯拉的 1 小时循环缓冲删除之前，自动将 RecentClips 从 USB 镜像（只读挂载）
# 复制到树莓派 SD 卡。零 USB 中断。
archive:
  enabled: true                          # 启用 RecentClips 存档
  interval_minutes: 2                    # 检查新视频的频率（越频繁数据丢失越少）
  retention_days: 30                     # 删除超过此天数的已存档视频
  min_free_space_gb: 20                  # 硬下限 — SD 卡空闲空间低于此值则停止存档。Issue #109：从 10 → 20 GiB 提升。在典型 470 GiB SD 卡上，10 GiB ≈ 2.1% 空闲，远低于 ext4 空闲块组搜索开始抖动并使每次写入成本膨胀 10-100 倍的点，从而饿死看门狗守护进程。20 GiB ≈ 4.2% 为 ext4 提供足够的余量保持写入低成本。
  max_size_gb: 0                         # 0 = 自动（使用全部可用空间减去预留）
  path: ""                               # 存档路径（默认：~/ArchivedClips，由 Web 应用设置）
  # 静止 RecentClips 源头跳过现已无条件启用（issue #184 Wave 1）。
  # 存档工作线程检查每个 RecentClips 候选的 SEI 元数据；
  # 不含 GPS-SEI 消息的视频被标记为 ``skipped_stationary`` 而不是复制。
  # Sentry/Saved 事件视频为 PRIORITY_EVENTS，永不会进入跳过路径。
  # 存储与保留策略卡片上的回收按钮仍然会清理此默认生效前已存档的静止 RecentClips。

# ============================================================================
# 存档队列配置 (issue #76)
# ============================================================================
# geodata.db 中持久化的 SQLite 支持队列，用于双队列存档管道。
# 三个生产者填充队列：inotify 文件监控器、定期全目录重新扫描、
# 以及一次性启动追赶扫描。
# Phase 2b 工作线程逐个处理队列中的文件。
# 整个子系统现为无条件启用（issue #184 Wave 1）——禁用它会导致
# 异常关机后无法追赶，设备进入降级状态，因此移除了关闭开关。
archive_queue:
  rescan_interval_seconds: 60            # 定期全目录重新扫描的间隔
  worker_check_interval_seconds: 5       # 队列空闲/为空时工作线程迭代之间的休眠时间
  retry_max_attempts: 3                  # 行进入 dead_letter 前的 OSError 重试次数
  copy_chunk_bytes: 1048576              # 临时文件+fsync+重命名复制的块大小 (1 MiB)
  # Phase 2c (issue #76) — 健康看门狗间隔。
  watchdog_check_interval_seconds: 60    # 存档健康看门狗检查频率
  # SDIO 总线争用保护。Pi Zero 2 W 共享一个 SDIO 控制器
  # 用于 SD 卡和 WiFi 芯片；激进的存档复制可能饿死内核看门狗守护进程
  # 并触发硬件重置。这些参数允许工作线程在负载下退避。
  inter_file_sleep_seconds: 1.0          # 成功复制之间的休眠时间（原为 0.25）
  load_pause_threshold: 3.5              # 1 分钟平均负载超过此值时暂停
  load_pause_seconds: 30                 # 负载过高时暂停多长时间
  boot_scan_defer_seconds: 30            # 生产者启动后等待此秒数再进行首次扫描
  # 复制过程中的 SDIO 争用保护 (issue #104)。
  # 文件间的负载暂停守卫仅在迭代边界触发；一旦 _atomic_copy 开始，
  # 没有任何东西限制它。在持续 SDIO 饱和下，一次 25-50 MB 视频复制可能花费
  # 3-6 分钟，饿死用户空间看门狗守护进程足够久以触发 BCM2835 硬件看门狗
  #（90s 超时）。以下两个参数在 _atomic_copy 内部增加了每块和每文件的安全网。
  chunk_pause_seconds: 0.25              # 当 1 分钟平均负载 > load_pause_threshold 时块间休眠时间 (issue #104 缓解措施 A)
  per_file_time_budget_seconds: 60.0     # 任何单次复制超过此时间则中止+重新入队（不计重试次数）(issue #104 缓解措施 B)
  # Phase 5.9 (issue #102) — 额外的高级可调参数，通过
  # 设置 → 高级子页面开放，让高级用户无需 SSH 编辑此文件即可调优。
  stable_write_age_seconds: 5.0          # 重新入队 mtime 小于此秒数的视频（避免复制正在写入中的文件）
  stale_claim_max_age_seconds: 600.0     # 工作线程启动时将超过此时间的 'claimed' 行重置为 'pending'（恢复崩溃/OOM 的声明）
  # Wave 4 PR-E (issue #184)：统一 ``pipeline_queue`` 的影子模式验证。
  # 启用时，存档工作线程在每次 ``archive_queue`` 声明前窥视
  # ``pipeline_queue``，如果两个读取器对下一行是什么存在分歧则记录 WARNING。
  # 纯可观测性 — 无行为改变。用于在实际生产流量下验证
  # 双写产生正确排序，然后 PR-F 再切换实际读取器。
  # 禁用以消除（开销很小的）额外窥视；
  # 默认 ``true`` 以便在修复不匹配仍然容易时获取生产验证数据。
  shadow_pipeline_queue: true

  # Wave 4 PR-F1 (issue #184)：统一队列读取器切换。
  # 启用时，存档工作线程从 ``pipeline_queue``
  #（通过 ``claim_next_for_stage``）声明下一行，而非从传统的 ``archive_queue``。
  # 传统表继续通过现有的双写钩子接收状态镜像，
  # 因此在切换期间保持一致影子。默认 ``false``，使全新部署为零操作；
  # PR-E 影子遥测确认两个读取器在生产流量上一致后翻转为 ``true``。
  # 回退只需翻转一个配置标志 — 无需 DB 回滚。
  use_pipeline_reader: false
